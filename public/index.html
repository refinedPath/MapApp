<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapApp</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.slate.min.css">
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
  <script defer src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <link href="/css/styles.css" rel="stylesheet" />
  <script defer src="/js/app.js"></script>
</head>

<body>

  <div id="mapContainer" hidden></div>
  <div id="mapCustomControls" hidden>
    <button id="addPlaceBtn">Add place</button>
    <button id="manageTagsBtn">Manage tags</button>
    <button id="filterBtn">Filter</button>
  </div>

  <div id="authView">
    <article>
      <h2>Login</h2>
      <form id="loginForm" name="loginForm">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" name="loginEmail" autocomplete="email" required>
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="loginPassword" autocomplete="current-password" required>
        <p id="loginError" role="alert"></p>
        <input type="submit" value="Login">
      </form>
    </article>
  </div>

  <dialog id="createPlaceDialog" aria-labelledby="createPlaceTitle">
    <article>
      <h3 id="createPlaceTitle">New place</h3>
      <form id="createPlaceForm" method="dialog">
        <label for="placeName">Name *</label>
        <input type="text" id="placeName" name="placeName" required>
        <label for="placeDescription">Description</label>
        <textarea id="placeDescription" name="placeDescription"></textarea>
        <p id="createPlaceError" role="alert"></p>
        <div class="modal-actions modal-actions--end">
          <div class="modal-actions__primary">
            <input type="button" id="cancelCreatePlaceBtn" class="outline secondary" value="Cancel">
            <input type="submit" value="Save">
          </div>
        </div>
      </form>
    </article>
  </dialog>

  <dialog id="editPlaceDialog" aria-labelledby="editPlaceTitle">
    <article>
      <h3 id="editPlaceTitle">Edit place</h3>
      <form id="editPlaceForm" method="dialog">
        <label for="editPlaceName">Name *</label>
        <input type="text" id="editPlaceName" name="editPlaceName" required>
        <label for="editPlaceDescription">Description</label>
        <textarea id="editPlaceDescription" name="editPlaceDescription"></textarea>
        <section id="editPlaceTags" aria-label="Assigned tags">
          <h4>Assigned tags</h4>
          <div id="editPlaceTagsList"></div>
        </section>
        <section id="editPlaceAllTags" aria-label="All tags">
          <h4>All tags</h4>
          <div id="editPlaceAllTagsList"></div>
        </section>
        <p id="editPlaceError" role="alert"></p>
        <div class="modal-actions">
          <input type="button" id="deleteEditPlaceBtn" class="outline secondary btn-danger" value="Delete place">
          <div class="modal-actions__primary">
            <input type="button" id="cancelEditPlaceBtn" class="outline secondary" value="Cancel">
            <input type="submit" value="Save">
          </div>
        </div>
      </form>
    </article>
  </dialog>

  <dialog id="manageTagsDialog" aria-labelledby="manageTagsTitle">
    <article>
      <h3 id="manageTagsTitle">Manage tags</h3>
      <form id="tagForm">
        <div class="tag-form__fields">
          <input type="text" id="tagFormName" name="tagFormName" placeholder="Tag name" aria-label="Tag name" required>
          <input type="color" id="tagFormColor" name="tagFormColor" aria-label="Tag color">
          <input type="text" id="tagFormEmoji" name="tagFormEmoji" placeholder="Emoji" aria-label="Tag emoji"
            class="tag-form__emoji">
        </div>
        <p id="tagFormError" role="alert"></p>
        <div class="modal-actions modal-actions--end">
          <div class="modal-actions__primary">
            <input type="button" id="tagFormCancelBtn" class="outline secondary" value="Cancel" hidden>
            <input type="submit" id="tagFormSubmit" value="Add tag">
          </div>
        </div>
      </form>
      <div id="tagManagerList"></div>
      <div class="modal-actions modal-actions--end">
        <input type="button" id="closeManageTagsBtn" class="outline secondary" value="Close">
      </div>
    </article>
  </dialog>

  <dialog id="filterDialog" aria-labelledby="filterTitle">
    <article>
      <h3 id="filterTitle">Filter places by tags</h3>

      <fieldset>
        <legend>Match</legend>
        <label>
          <input type="radio" name="filterMode" value="any" checked>
          Any of these tags
        </label>
        <label>
          <input type="radio" name="filterMode" value="all">
          All of these tags
        </label>
      </fieldset>

      <div id="filterTagsList"></div>

      <div class="modal-actions">
        <input type="button" id="filterClearBtn" class="outline secondary" value="Clear filter">
        <div class="modal-actions__primary">
          <input type="button" id="filterCancelBtn" class="outline secondary" value="Cancel">
          <input type="button" id="filterApplyBtn" value="Apply">
        </div>
      </div>
    </article>
  </dialog>

</body>

</html>
